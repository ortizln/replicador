# /etc/nginx/sites-available/replicador
#
# Sirve todo bajo /replicador:
#   https://tudominio.com/replicador/         → Frontend Angular
#   https://tudominio.com/replicador/api/...  → Flask backend

upstream flask_api {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    client_max_body_size 500M;

    # Frontend Angular — archivos estáticos
    location /replicador {
        alias /var/www/replicador-frontend;
        try_files $uri $uri/ /replicador/index.html;
        index index.html;
    }

    # API Flask — proxy inverso
    location /replicador/api/ {
        proxy_pass http://flask_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /var/www/replicador-frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSL con Certbot
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
}
