# /etc/nginx/sites-available/replicador.conf
#
# Subdominios:
#   api.replicador.tudominio.com  → Flask backend (Gunicorn :5000)
#   app.replicador.tudominio.com  → Angular frontend (archivos estáticos)
#   replicador.tudominio.com      → Redirige a app (opcional)

upstream flask_api {
    server 127.0.0.1:5000;
}

# === API (api.replicador.tudominio.com) ===
server {
    listen 80;
    server_name api.replicador.tudominio.com;

    client_max_body_size 500M;

    location / {
        proxy_pass http://flask_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Para producción: SSL con Certbot
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/api.replicador.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.replicador.tudominio.com/privkey.pem;
}

# === APP / Frontend (app.replicador.tudominio.com) ===
server {
    listen 80;
    server_name app.replicador.tudominio.com;

    root /var/www/replicador-frontend;
    index index.html;

    # Angular rutas SPA → siempre index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy inverso al API desde el frontend (opcional si usas /api)
    # location /api/ {
    #     proxy_pass http://flask_api;
    # }

    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/app.replicador.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.replicador.tudominio.com/privkey.pem;
}
