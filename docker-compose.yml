services:

  redis:
    image: redis:7-alpine
    container_name: replicador-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: replicador-api
    restart: unless-stopped
    network_mode: host
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:086411421@192.168.100.215:5432/replicador_platform
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backups:/tmp

  celery-worker:
    build: ./backend
    container_name: replicador-celery
    restart: unless-stopped
    network_mode: host
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:086411421@192.168.100.215:5432/replicador_platform
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backups:/tmp

  celery-beat:
    build: ./backend
    container_name: replicador-beat
    restart: unless-stopped
    network_mode: host
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:086411421@192.168.100.215:5432/replicador_platform
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

volumes:
  backups:
